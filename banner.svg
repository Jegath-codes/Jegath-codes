  <text x="600" y="255" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="15">
    Java • Python • C++ • React • PHP • MySQL • Git
  </text>

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="1196" height="356" rx="19" stroke="url(#accentGrad)" stroke-opacity="0.55" stroke-width="2"/>
