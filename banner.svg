    <text x="680" y="222" fill="#38bdf8">CREATE TABLE hostel_management (id INT PRIMARY KEY);</text>

    <text x="36" y="252" fill="#34d399">08      System.out.println("BCA Graduate 2022 - 2026");</text>
    <text x="650" y="252" fill="#c084fc">export default function Portfolio() { return true; }</text>

    <text x="36" y="282" fill="#94a3b8">09      // Loyola College of Arts and Science • CGPA: 6.5</text>
    <text x="690" y="282" fill="#34d399">git push origin main  --status=200 OK</text>

    <text x="36" y="312" fill="#38bdf8">10  }  /* Built with Passion for Technology */</text>
    <text x="720" y="312" fill="#f472b6">console.log("Welcome to Jegath's GitHub!");</text>
  </g>

  <!-- Center Glass Terminal Card -->
  <rect x="190" y="64" width="820" height="232" rx="18" fill="#070d1f" fill-opacity="0.86" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Terminal Window Dots -->
  <circle cx="222" cy="90" r="6" fill="#ef4444"/>
  <circle cx="244" cy="90" r="6" fill="#f59e0b"/>
  <circle cx="266" cy="90" r="6" fill="#10b981"/>
  <text x="530" y="95" fill="#94a3b8" font-family="Consolas, monospace" font-size="13">jegath-codes@github:~/portfolio</text>

